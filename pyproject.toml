[project]
name = "fpl-forecast"
version = "0.1.0"
description = "Real-data foundation for Fantasy Premier League forecasting."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.3",
    "httpx>=0.27.2",
    "pandas>=2.2.3",
    "pyarrow>=18.0.0",
    "pydantic>=2.9.2",
    "rich>=13.9.4",
    "scipy>=1.13",
    "typer>=0.15.1",
]

[project.scripts]
fpl = "fpl_forecast.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_forecast"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
