name: Publish official FPL forecast

on:
  workflow_dispatch:
    inputs:
      season:
        description: Official season in YYYY-YY form
        required: true
        default: "2026-27"
        type: string
      target_gameweek:
        description: Optional official gameweek; leave blank for deterministic resolution
        required: false
        type: string
      run_id:
        description: Optional safe run ID; leave blank to derive one from this workflow run
        required: false
        type: string
      confirm_official_publication:
        description: Confirm that this is an official public forecast publication
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Reconstruct, forecast, validate, and build
    if: ${{ inputs.confirm_official_publication == 'yes' }}
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.inputs.outputs.run_id }}
      target_gameweek: ${{ steps.target.outputs.target_gameweek }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked Python environment
        run: uv sync --locked --dev

      - name: Validate workflow inputs
        id: inputs
        env:
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
          REQUESTED_GAMEWEEK: ${{ inputs.target_gameweek }}
        run: |
          if [[ -n "$REQUESTED_RUN_ID" ]]; then
            RUN_ID="$REQUESTED_RUN_ID"
          else
            RUN_ID="official_${{ inputs.season }}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          fi
          if [[ ! "$RUN_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Unsafe run ID: $RUN_ID" >&2
            exit 1
          fi
          if [[ -n "$REQUESTED_GAMEWEEK" && ! "$REQUESTED_GAMEWEEK" =~ ^[1-9][0-9]*$ ]]; then
            echo "Target gameweek must be a plain positive integer: $REQUESTED_GAMEWEEK" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Run focused publication tests
        run: uv run pytest -q tests/test_phase9b2_publication.py tests/test_season.py tests/test_phase8_operations.py -m "not slow"

      - name: Reconstruct historical and official inputs
        env:
          TARGET_GAMEWEEK: ${{ inputs.target_gameweek }}
        run: |
          args=(
            --season "${{ inputs.season }}"
            --historical-seasons "2022-23,2023-24,2024-25,2025-26"
            --revision "f2090d378ebd1b0c3d14884770dde95f38c50a0d"
            --output reports/operational/publication_preparation.json
            --run-id "${{ steps.inputs.outputs.run_id }}"
          )
          if [[ -n "$TARGET_GAMEWEEK" ]]; then
            args+=(--target-gameweek "$TARGET_GAMEWEEK")
          fi
          uv run fpl prepare-publication-data "${args[@]}"

      - name: Record resolved target
        id: target
        run: |
          target="$(uv run python -c 'import json; print(json.load(open("reports/operational/publication_preparation.json"))["target"]["gameweek"])')"
          echo "target_gameweek=$target" >> "$GITHUB_OUTPUT"

      - name: Run verified official forecast chain
        run: |
          uv run fpl run-publication-forecast \
            --preparation reports/operational/publication_preparation.json \
            --run-id "${{ steps.inputs.outputs.run_id }}"

      - name: Apply mandatory publication gates
        run: |
          uv run fpl validate-publication \
            --preparation reports/operational/publication_preparation.json \
            --run-id "${{ steps.inputs.outputs.run_id }}" \
            --audit-dir reports/operational/publication_audit

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Synchronize allowlisted public artifacts
        working-directory: frontend
        run: npm run sync-data

      - name: Revalidate sanitized publication
        run: |
          uv run fpl validate-publication \
            --preparation reports/operational/publication_preparation.json \
            --run-id "${{ steps.inputs.outputs.run_id }}" \
            --audit-dir reports/operational/publication_audit \
            --public-dir frontend/public/data

      - name: Freeze the sanitized public forecast bundle
        working-directory: frontend
        run: |
          node scripts/frozen-forecast-cli.mjs freeze \
            --source public/data \
            --destination "$RUNNER_TEMP/frozen-forecast/data"

      - name: Report frozen forecast identity
        run: |
          jq '{run_id, target_season, target_gameweek, completed_at, frontend_schema_version, simulator: .model_lineage.xpoints_simulator.version, output_contract: .model_lineage.xpoints_simulator.model_contract_version}' frontend/public/data/run_manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Persist the frozen public forecast bundle
        env:
          FROZEN_BRANCH: official-forecast-data
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "$FROZEN_BRANCH"
          git worktree add --detach "$RUNNER_TEMP/frozen-forecast-branch" "origin/$FROZEN_BRANCH"
          rm -rf "$RUNNER_TEMP/frozen-forecast-branch/data"
          cp -R "$RUNNER_TEMP/frozen-forecast/data" "$RUNNER_TEMP/frozen-forecast-branch/data"
          git -C "$RUNNER_TEMP/frozen-forecast-branch" add data
          if git -C "$RUNNER_TEMP/frozen-forecast-branch" diff --cached --quiet; then
            echo "Frozen bundle already matches the validated official publication."
            exit 0
          fi
          git -C "$RUNNER_TEMP/frozen-forecast-branch" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/frozen-forecast-branch" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/frozen-forecast-branch" commit -m "Freeze official forecast ${{ steps.inputs.outputs.run_id }}"
          git -C "$RUNNER_TEMP/frozen-forecast-branch" push origin HEAD:"$FROZEN_BRANCH"

      - name: Upload non-public reconstruction and publication audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: publication-audit-${{ steps.inputs.outputs.run_id }}
          path: |
            reports/operational/
            data/raw/fpl_api/${{ inputs.season }}/
            data/normalized/${{ inputs.season }}/current_season_reconstruction.json
            outputs/operational/failed/
          if-no-files-found: warn
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    name: Deploy validated official forecast
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
