<rect x="675.00" y="505.00" width="300.00" height="88.00" rx="8.00" fill="#F8FAFC" stroke="#D55E00" stroke-width="2" opacity="1"/>
<text x="825.00" y="535.00" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#202124">2025-26 is not an untouched holdout</text>
<text x="825.00" y="563.00" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#202124">Its results informed preseason hardening.</text>
<text x="825.00" y="585.00" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#202124">Report it as historical development evidence.</text>
