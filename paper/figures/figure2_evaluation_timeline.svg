<text x="540.00" y="155.00" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#202124">2024-25</text>
<circle cx="750.00" cy="190.00" r="12.00" fill="#D55E00" stroke="#FFFFFF" stroke-width="1" opacity="1"/>
<text x="750.00" y="155.00" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#202124">2025-26</text>
<circle cx="960.00" cy="190.00" r="12.00" fill="#009E73" stroke="#FFFFFF" stroke-width="1" opacity="1"/>
<text x="960.00" y="155.00" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#202124">2026-27</text>
<rect x="240.00" y="240.00" width="180.00" height="72.00" rx="7.00" fill="#F8FAFC" stroke="#6B7280" stroke-width="1" opacity="1"/>
