<text x="540.00" y="268.00" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#202124">Rolling + GW1 test folds</text>
<rect x="660.00" y="240.00" width="180.00" height="72.00" rx="7.00" fill="#F8FAFC" stroke="#6B7280" stroke-width="1" opacity="1"/>
<text x="750.00" y="268.00" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#202124">Rolling + GW1</text>
<text x="750.00" y="290.00" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#202124">hardening evidence</text>
<rect x="90.00" y="370.00" width="650.00" height="70.00" rx="8.00" fill="#56B4E9" stroke="#0072B2" stroke-width="1" opacity="0.18"/>
